services:
  db:
    image: postgres:16-alpine
    container_name: soul-beer-db
    environment:
      POSTGRES_USER: soul
      POSTGRES_PASSWORD: soul
      POSTGRES_DB: soulbeer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soul -d soulbeer"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
